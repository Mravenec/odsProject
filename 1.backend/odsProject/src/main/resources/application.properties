# jOOQ
spring.jooq.sql-dialect=MARIADB

# JWT
app.jwt.secret=odsProjectSecretKey2030Agenda_ChangeInProduction!
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=*

# LOGGING
logging.level.com.odsProject=DEBUG
logging.level.org.jooq.tools.LoggerListener=INFO

# ── HikariCP Pool Limits ─────────────────────────────────────────────
# Total: 5(login) + 5(master) + 17×2(ods01-17) = 44 connections
# MariaDB default max_connections = 151 → safe margin
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

app.datasource.ods-master.hikari.maximum-pool-size=5
app.datasource.ods-master.hikari.minimum-idle=2
app.datasource.ods-master.hikari.connection-timeout=20000

